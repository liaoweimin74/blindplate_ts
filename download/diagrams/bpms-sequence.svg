<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="mSlate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="mTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/>
    </marker>
    <marker id="mAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <marker id="mRose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/>
    </marker>
    <marker id="mOpen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1010" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <rect x="24" y="16" width="6" height="24" rx="3" fill="#0d9488"/>
  <text x="42" y="35" font-size="18" font-weight="700" fill="#0f172a">两系统业务协同时序 · 开票 → 审批 → 作业 → 关闭闭环</text>

  <!-- ===== 参与者 ===== -->
  <rect x="85" y="54" width="170" height="58" rx="10" fill="#f8fafc" stroke="#b6c2cf" stroke-width="1.4" filter="url(#sh)"/>
  <text x="170" y="78" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">车间/装置用户</text>
  <text x="170" y="98" font-size="10.5" fill="#7a8694" text-anchor="middle">发起需求 · 参与作业</text>

  <rect x="440" y="54" width="210" height="58" rx="10" fill="#0d9488" stroke="#0d9488" filter="url(#sh)"/>
  <text x="545" y="78" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">盲板管理系统 BPMS</text>
  <text x="545" y="98" font-size="10.5" fill="#ccf3ec" text-anchor="middle">我司建设 · 盲板业务全流程</text>

  <rect x="735" y="54" width="190" height="58" rx="10" fill="#d97706" stroke="#d97706" filter="url(#sh)"/>
  <text x="830" y="78" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">集成服务</text>
  <text x="830" y="98" font-size="10.5" fill="#fde8c8" text-anchor="middle">我司建设 · 本次新增</text>

  <rect x="1010" y="54" width="220" height="58" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="1120" y="78" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">作业票系统（石化盈科）</text>
  <text x="1120" y="98" font-size="10.5" fill="#6b7280" text-anchor="middle">客户既有 · 继续沿用</text>

  <!-- ===== 生命线 ===== -->
  <line x1="170" y1="112" x2="170" y2="928" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="545" y1="112" x2="545" y2="928" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="830" y1="112" x2="830" y2="928" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="1120" y1="112" x2="1120" y2="928" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- ===== 消息 1~8 ===== -->
  <!-- 1 用户→BPMS -->
  <text x="357" y="146" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">需求受理 → 勘察 → JSA → 方案 → 处置确认</text>
  <text x="357" y="162" font-size="10.5" fill="#94a3b8" text-anchor="middle">BPMS 内闭环 · 状态机管控不可跳步</text>
  <line x1="178" y1="172" x2="537" y2="172" stroke="#475569" stroke-width="1.8" marker-end="url(#mSlate)"/>
  <circle cx="196" cy="172" r="9" fill="#475569"/>
  <text x="196" y="175.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <!-- 2 BPMS→集成 -->
  <text x="687" y="222" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">提交开票申请：票面要素 · 隔离点清单 · 安全措施</text>
  <line x1="553" y1="232" x2="822" y2="232" stroke="#0d9488" stroke-width="1.8" marker-end="url(#mTeal)"/>
  <circle cx="571" cy="232" r="9" fill="#0d9488"/>
  <text x="571" y="235.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <!-- 3 集成→作业票 -->
  <text x="975" y="272" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">创建作业票（REST · 幂等）</text>
  <line x1="838" y1="282" x2="1112" y2="282" stroke="#d97706" stroke-width="1.8" marker-end="url(#mAmber)"/>
  <circle cx="856" cy="282" r="9" fill="#d97706"/>
  <text x="856" y="285.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 4 作业票→集成 回执 -->
  <text x="975" y="322" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">返回作业票编号与状态</text>
  <line x1="1112" y1="332" x2="838" y2="332" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mOpen)"/>
  <circle cx="1094" cy="332" r="9" fill="#94a3b8"/>
  <text x="1094" y="335.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- 5 集成→BPMS 回写 -->
  <text x="687" y="372" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">回写票号与票据状态</text>
  <line x1="822" y1="382" x2="553" y2="382" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mOpen)"/>
  <circle cx="804" cy="382" r="9" fill="#94a3b8"/>
  <text x="804" y="385.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>

  <!-- 6 作业票自循环 审批 -->
  <path d="M1120 420 h38 v28 h-38" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#mOpen)"/>
  <text x="1104" y="430" font-size="12" font-weight="500" fill="#334155" text-anchor="end">作业票审批流转</text>
  <text x="1104" y="446" font-size="10.5" fill="#94a3b8" text-anchor="end">沿用既有审批流 · 各级签批</text>
  <circle cx="1004" cy="430" r="9" fill="#94a3b8"/>
  <text x="1004" y="433.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>

  <!-- 7 作业票→集成 状态事件 -->
  <text x="975" y="494" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">票据状态变更事件（批准 / 驳回）</text>
  <line x1="1112" y1="504" x2="838" y2="504" stroke="#d97706" stroke-width="1.8" marker-end="url(#mAmber)"/>
  <circle cx="1094" cy="504" r="9" fill="#d97706"/>
  <text x="1094" y="507.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>

  <!-- 8 集成→BPMS 同步 -->
  <text x="687" y="544" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">同步审批状态至 BPMS</text>
  <line x1="838" y1="554" x2="553" y2="554" stroke="#d97706" stroke-width="1.8" marker-end="url(#mAmber)"/>
  <circle cx="804" cy="554" r="9" fill="#d97706"/>
  <text x="804" y="557.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>

  <!-- ===== alt 框：审批结果 ===== -->
  <rect x="98" y="572" width="1072" height="280" fill="#f0fdfa" opacity="0.55"/>
  <rect x="98" y="855" width="1072" height="71" fill="#fff1f2" opacity="0.5"/>
  <rect x="96" y="570" width="1076" height="358" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="112" y="558" width="88" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="156" y="574.5" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">审批结果</text>
  <line x1="96" y1="853" x2="1172" y2="853" stroke="#f0aab5" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="112" y="582" width="52" height="22" rx="6" fill="#0d9488"/>
  <text x="138" y="597.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">批准</text>
  <rect x="112" y="864" width="52" height="22" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="138" y="879.5" font-size="11.5" font-weight="700" fill="#be123c" text-anchor="middle">驳回</text>

  <!-- 9 BPMS 自循环 放行作业 -->
  <path d="M545 620 h38 v26 h-38" fill="none" stroke="#0d9488" stroke-width="1.6" marker-end="url(#mTeal)"/>
  <text x="598" y="630" font-size="12" font-weight="500" fill="#334155">放行现场作业（移动端闭环）</text>
  <text x="598" y="646" font-size="10.5" fill="#94a3b8">交底 → 开工扫码 → 施工 → 验收</text>
  <circle cx="528" cy="630" r="9" fill="#0d9488"/>
  <text x="528" y="633.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>

  <!-- 10 BPMS→集成 完工回传 -->
  <text x="687" y="690" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">完工与验收结果回传：结论 · 照片索引 · 参与人员</text>
  <line x1="553" y1="700" x2="822" y2="700" stroke="#0d9488" stroke-width="1.8" marker-end="url(#mTeal)"/>
  <circle cx="571" cy="700" r="9" fill="#0d9488"/>
  <text x="571" y="703.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>

  <!-- 11 集成→作业票 触发关闭 -->
  <text x="975" y="738" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">回填完工信息 · 触发作业票关闭</text>
  <line x1="838" y1="748" x2="1112" y2="748" stroke="#d97706" stroke-width="1.8" marker-end="url(#mAmber)"/>
  <circle cx="856" cy="748" r="9" fill="#d97706"/>
  <text x="856" y="751.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">11</text>

  <!-- 12 作业票→集成 关闭回执 -->
  <text x="975" y="786" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">票据关闭回执</text>
  <line x1="1112" y1="796" x2="838" y2="796" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mOpen)"/>
  <circle cx="1094" cy="796" r="9" fill="#94a3b8"/>
  <text x="1094" y="799.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">12</text>

  <!-- 13 集成→BPMS 归档 -->
  <text x="687" y="830" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">闭环归档 · 盲板转库存管理</text>
  <line x1="822" y1="840" x2="553" y2="840" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mOpen)"/>
  <circle cx="804" cy="840" r="9" fill="#94a3b8"/>
  <text x="804" y="843.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">13</text>

  <!-- 14 集成→BPMS 驳回 -->
  <text x="687" y="890" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">标记驳回原因 · 退回方案编制环节整改</text>
  <line x1="822" y1="900" x2="553" y2="900" stroke="#e11d48" stroke-width="1.8" marker-end="url(#mRose)"/>
  <circle cx="804" cy="900" r="9" fill="#e11d48"/>
  <text x="804" y="903.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">14</text>

  <!-- ===== 底部关键控制点横幅 ===== -->
  <rect x="40" y="950" width="1200" height="40" rx="10" fill="#fffbeb" stroke="#ecd9a0"/>
  <path d="M64 960 L75 979 H53 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <text x="64" y="975" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">!</text>
  <text x="92" y="975" font-size="12.5" fill="#92400e">关键控制点：作业票「已批准」是现场作业放行的硬性前置条件；作业票关闭以 BPMS 回传的完工验收结果为触发依据</text>
</svg>
