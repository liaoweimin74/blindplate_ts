<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bpmsg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- 圆角方块底：与主界面侧边栏 emerald/teal 色系一致 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bpmsg)"/>
  <!-- 法兰盘外圈 -->
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- 中心盲板孔 -->
  <circle cx="32" cy="32" r="6.5" fill="#ffffff"/>
  <!-- 8 颗螺栓孔 -->
  <g fill="#ffffff">
    <circle cx="32" cy="18.5" r="2.3"/>
    <circle cx="32" cy="45.5" r="2.3"/>
    <circle cx="18.5" cy="32" r="2.3"/>
    <circle cx="45.5" cy="32" r="2.3"/>
    <circle cx="22.1" cy="22.1" r="2.3"/>
    <circle cx="41.9" cy="22.1" r="2.3"/>
    <circle cx="22.1" cy="41.9" r="2.3"/>
    <circle cx="41.9" cy="41.9" r="2.3"/>
  </g>
  <!-- 盲板抽堵状态指示：右上角状态点（amber=作业中） -->
  <circle cx="49" cy="15" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5"/>
</svg>
